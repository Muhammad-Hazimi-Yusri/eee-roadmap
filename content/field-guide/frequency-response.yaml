id: frequency-response
title: "Frequency response (FSM, LFSM, droop)"
kicker: "How much power to add or shed per hertz, and when"
order: 5
checked: "2026-10-24"

asks:
  - "What's the difference between FSM, LFSM-O and LFSM-U?"
  - "What does a 4% droop mean in MW for my plant?"
  - "Why does LFSM-O start at 50.4 Hz in GB but 50.2 Hz in Ireland?"
  - "Is the droop on Registered Capacity or on current output?"

summary: >-
  After a loss, inertia sets the first-second RoCoF; then plant changes
  output in proportion to the frequency error — the droop. FSM is that
  control running all the time around 50 Hz. LFSM-O and LFSM-U are
  emergency-only versions that wake up beyond a threshold.

bigPicture: |
  - **The timeline.** Inertia acts instantly; proportional (droop) response
    acts over seconds and arrests the fall; slower reserves and re-dispatch
    then bring frequency back to 50 Hz over tens of seconds to minutes.
  - **Droop in one line.** $s = \dfrac{\Delta f/f_0}{\Delta P/P_{base}}$, so
    $\dfrac{\Delta P}{P_{base}} = \dfrac{\Delta f/f_0}{s}$. A 10% droop gives
    2% of the base per 0.1 Hz; a 4% droop gives 5%.
  - **Three modes.** *FSM* — continuous, small deadband, both directions.
    *LFSM-O* — every Type, cuts output only above a high threshold. *LFSM-U* —
    Type C and up, adds output (if it has headroom) only below a low threshold.
  - **Why Ireland is stricter.** The all-island system is small, so the same
    loss moves frequency further and faster. Its LFSM-O starts lower
    (50.2 Hz vs 50.4 Hz) and its default droop is steeper (4% vs 10%).

visuals: [droop-explorer, frequency-timeline]

keyIdeas:
  - title: "LFSM-O is for everyone"
    body: >-
      RfG puts LFSM-O in the type A base layer, so every Type inherits it. GB:
      above 50.4 Hz at 10% droop. Ireland and NI: from 50.2 Hz at a 4% default,
      settable 2–12%.
    refs:
      - { clause: "nc-rfg/Art.13", pin: "13(2)" }
      - "grid-code/ECC.6.3.7.1"
      - "eirgrid-grid-code/PPM1.5.3.11"
      - "soni-grid-code/CC8.8.7"
  - title: "LFSM-U from Type C"
    body: >-
      Below 49.5 Hz in all three codes; 10% droop in GB, 4% default in Ireland
      and NI. Response is limited by available headroom.
    refs:
      - { clause: "nc-rfg/Art.15", pin: "15(2)(c)" }
      - "grid-code/ECC.6.3.7.2"
      - "eirgrid-grid-code/PPM1.5.3.12"
  - title: "FSM: the TSO picks inside RfG's ranges"
    body: >-
      RfG Table 4 allows droop 2–12%, deadband 0–500 mHz, insensitivity
      10–30 mHz and an FSM power range of 1.5–10% of Pmax; Table 5 wants
      activation within 2 s and full response within 30 s. GB picked droop
      3–5%, no deadband, ±15 mHz insensitivity and a 10% range.
    refs:
      - { clause: "nc-rfg/Art.15", pin: "15(2)(d), Tables 4–5" }
      - { clause: "grid-code/ECC.6.3.7.3", pin: "Table ECC.6.3.7.3.3(a)" }
  - title: "Ireland: droop on Registered Capacity, from 50 Hz"
    body: >-
      EirGrid calculates PPM droop on Registered Capacity (2–12% RfG, default
      4%), measures the deviation from nominal frequency rather than from the
      deadband edge, and wants 60% of the response in 5 s and all of it in 15 s.
    refs:
      - { clause: "eirgrid-grid-code/PPM1.5.3", pin: "PPM1.5.3.1, .5.3.3" }
  - title: "NI PPM governor: a wide-range droop"
    body: >-
      NI PPMs carry a fast proportional governor with droop settable 2–20%,
      adjustable deadband edges, and the ability to run curtailed (50–100%) to
      hold reserve.
    refs: ["soni-grid-code/CC.S2.1.7.2"]
  - title: "Ride through the frequency range first"
    body: >-
      Response only matters if the plant stays on. GB: protect only outside
      47–52 Hz. Ireland PPMs: 49.5–50.5 Hz continuous, 47.5–52 Hz for 60 min,
      47–47.5 Hz for 20 s. NI: 49–51 Hz continuous with timed bands to 47 and
      52 Hz.
    refs:
      - "grid-code/ECC.6.3.13"
      - "eirgrid-grid-code/PPM1.5"
      - "soni-grid-code/CC8.8.6"

