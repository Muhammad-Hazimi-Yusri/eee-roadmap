        IE:  { text: "2–12%, default 4%", ref: "eirgrid-grid-code/PPM1.5.3.11" }
        NI:  { text: "Default 4% (5% per 0.1 Hz), settable 2–12%", ref: "soni-grid-code/CC8.8.7" }
