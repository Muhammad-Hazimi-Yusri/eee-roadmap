        IE:  { text: "Below 49.5 Hz, default 4%", ref: "eirgrid-grid-code/PPM1.5.3.12" }
        NI:  { text: "Below 49.5 Hz, default 4%", ref: "soni-grid-code/CC8.8.7" }
        RfG: { text: "Type C and up", ref: { clause: "nc-rfg/Art.15", pin: "15(2)(c)" } }
    - param: "FSM droop"
      cells:
        GB:  { text: "3–5%", ref: "grid-code/ECC.6.3.7.3" }
        IE:  { text: "On RC: non-RfG 2–10%, RfG 2–12%, default 4%", ref: "eirgrid-grid-code/PPM1.5.3" }
        NI:  { text: "4% nominal (CC8.8.7.3) · PPM governor settable 2–20%", refs: ["soni-grid-code/CC8.8.7", "soni-grid-code/CC.S2.1.7.2"] }
        RfG: { text: "2–12%", ref: { clause: "nc-rfg/Art.15", pin: "Table 4" } }
    - param: "Deadband / insensitivity"
      cells:
        GB:  { text: "0 mHz / ±15 mHz", ref: "grid-code/ECC.6.3.7.3" }
        IE:  { text: "±15 mHz (non-RfG, APC mode)", ref: "eirgrid-grid-code/PPM1.5.3" }
        NI:  { text: "Insensitivity ±15 mHz (CC8.8.7.3) · PPM deadband edges settable 49–50 / 50–51 Hz", refs: ["soni-grid-code/CC8.8.7", "soni-grid-code/CC.S2.1.7.2"] }
        RfG: { text: "Deadband 0–500 mHz; insensitivity 10–30 mHz", ref: { clause: "nc-rfg/Art.15", pin: "Table 4" } }
    - param: "Speed"
      cells:
        IE:  { text: "60% in 5 s; 100% in 15 s", ref: { clause: "eirgrid-grid-code/PPM1.5.3", pin: "PPM1.5.3.3" } }
        NI:  { text: "Initial delay over 2 s must be justified (LFSM)", ref: "soni-grid-code/CC8.8.7" }
        RfG: { text: "Activation ≤2 s; full ≤30 s", ref: { clause: "nc-rfg/Art.15", pin: "Table 5" } }
    - param: "RoCoF withstand"
      cells:
        GB:  { text: "1 Hz/s over 500 ms (2 Hz/s grid-forming PPM)", ref: "grid-code/ECC.6.3.13" }
        IE:  { text: "1 Hz/s over 500 ms", ref: "eirgrid-grid-code/PPM1.5" }
        RfG: { text: "TSO specifies", ref: { clause: "nc-rfg/Art.13", pin: "13(1)(b)" } }
    - param: "Continuous frequency range"
      cells:
        GB:  { text: "Users protect plant against excursions outside 47–52 Hz", ref: "grid-code/ECC.6.3.13" }
        IE:  { text: "49.5–50.5 Hz (PPM)", ref: "eirgrid-grid-code/PPM1.5" }
        NI:  { text: "49–51 Hz", ref: "soni-grid-code/CC8.8.6" }

pitfalls:
  - title: "Droop on the wrong base"
    body: >-
      Irish PPM droop is on Registered Capacity, so the MW per hertz does not
      shrink at part load. A model that applies droop to current output
      under-delivers at low output.
    refs: [{ clause: "eirgrid-grid-code/PPM1.5.3", pin: "PPM1.5.3.1" }]
  - title: "Deadband edge vs nominal"
    body: >-
      Measuring the deviation from the deadband edge (a common default in
      generic models) gives less response than EirGrid's from-nominal rule.
      Toggle it in the explorer: the gap is deadband ÷ (50 Hz × droop).
    refs: [{ clause: "eirgrid-grid-code/PPM1.5.3", pin: "Figure PPM1.5.3.1.b note" }]
  - title: "GB thresholds in an Irish model"
    body: >-
      LFSM-O at 50.4 Hz misses the whole 50.2–50.4 Hz band Ireland expects
      response in, and 10% droop delivers less than half the 4% response.
    refs: ["grid-code/ECC.6.3.7.1", "eirgrid-grid-code/PPM1.5.3.11"]
  - title: "No headroom, no LFSM-U"
    body: >-
      Up-regulation needs margin. At Registered Capacity, or with no primary
      energy, a plant cannot add output; codes acknowledge this rather than
      require the impossible. Studies should state the operating point.
    refs: ["soni-grid-code/CC8.8.7", "grid-code/ECC.6.3.7.2"]
  - title: "Storage responds both ways"
    body: >-
      A battery can respond while importing. GB has a specific LFSM clause for
      storage in import mode; check direction-dependent limits.
    refs: [{ clause: "grid-code/ECC.6.3.7.2", pin: "ECC.6.3.7.2.3" }, "gn-storage/A.6"]

inStudies:
  - title: "Frequency response study and tests"
    body: >-
      Simulate frequency ramps and steps through each threshold; check delay,
      MW per hertz, final value and ramp rate. Then the site tests validate the
      model.
    refs:
      - "grid-code/ECP.A.3.6"
      - "grid-code/ECP.A.6.6"
      - "grid-code/ECP.A.5.8"
      - { clause: "erec-g99/C.7", pin: "C.7.6, C.7.7" }
  - title: "Model it as the code defines it"
    body: >-
      Base (RC vs output), deadband measurement, insensitivity, delay and ramp
      limits all change the MW you deliver. Put each one in the model
      explicitly and say which clause sets it.
    refs: ["eirgrid-grid-code/PPM1.5.3", "grid-code/ECC.6.3.7.3"]

