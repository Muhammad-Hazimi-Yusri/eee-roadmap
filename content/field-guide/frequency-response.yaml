      cells:
        GB:  { text: "50.4 Hz (50.5 Hz if already in FSM)", ref: "grid-code/ECC.6.3.7.1" }
        G99: { text: "Type C/D mirror the ECC (13.2.4)", ref: "erec-g99/13.2" }
        IE:  { text: "50.2 Hz", ref: "eirgrid-grid-code/PPM1.5.3.11" }
        NI:  { text: "50.2 Hz", ref: "soni-grid-code/CC8.8.7" }
        RfG: { text: "Required for every type", ref: { clause: "nc-rfg/Art.13", pin: "13(2)" } }
