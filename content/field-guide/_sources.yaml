_meta:
  description: |
    Bibliography for the field guide: textbooks, CIGRE and IEEE references.
    Grid codes and standards are NOT listed here; topics cite them through
    content/standards/_clauses.yaml so one corrected clause fixes every page.

    status records how a chapter/section pointer was verified (2026-10-24):
      checked   read from the publisher's table of contents or catalogue
      inferred  chapter number deduced from neighbouring checked chapters
      memory    not verified against any table of contents; cite by title
    Locations are for the edition named. Other editions renumber chapters.

