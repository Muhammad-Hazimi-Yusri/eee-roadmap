id: reactive-voltage
title: "Reactive capability & voltage control"
kicker: "How much Q the plant can make, and how it decides how much to make"
order: 4
checked: "2026-10-24"

asks:
  - "What reactive capability must the plant have at full output — and at 10% output?"
  - "Is that capability on Registered Capacity, MEC or Maximum Capacity?"
  - "What does a 4% slope mean, and why not just hold voltage exactly?"
  - "How fast must the voltage controller respond to a setpoint step?"

summary: >-
  Two separate requirements. Capability: the envelope of reactive power the
  plant can deliver across its active-power and voltage range, at a named
  point. Control: the controller that picks the operating point inside that
  envelope — setpoint, slope and speed.

bigPicture: |
  - **Why reactive power.** On a mostly inductive network the voltage drop
    along a line is roughly $\Delta V \approx (RP + XQ)/V$ with $X \gg R$, so
    voltage follows reactive flow. Plants hold local voltage by producing
    (lagging) or absorbing (leading) Q.
  - **Capability is drawn two ways.** A *P–Q* envelope (Q range as active
    power falls to zero) and a *U–Q/Pmax* envelope (Q range across the
    voltage band — more absorption needed at high voltage, more production at
    low). RfG caps how wide the TSO may draw the U–Q/Pmax inner envelope.
  - **Control is a droop, on purpose.** A *slope* lets voltage rise a little as
    the plant absorbs Q. Several plants on one bus then share Q in proportion
    instead of fighting to hold exactly the same voltage.
  - **Synchronous plant** gets its range from the machine capability curve and
    its excitation limiters; **converters** get it from current rating — so the
    rules are written differently for each.

visuals: [capability-chart, voltage-slope]

keyIdeas:
  - title: "Capability and control are separate tests"
    body: >-
      A plant can have the MVAr range on paper and still fail voltage control
      (too slow, wrong slope), or control well but run out of range at high
      voltage. Studies and tests cover both.
    refs:
      - "grid-code/ECC.6.3.2"
      - "grid-code/ECC.6.3.8"
  - title: "Know the base and the point"
    body: >-
      GB Type B: 0.95 pf lagging to leading at Maximum Capacity. Ireland PPMs:
      ±0.33 Q/Pmax at 100% of Registered Capacity, held at the same MVAr down to
      12% of RC, measured at the connection point. NI uses the same A–F
      envelope structure.
    refs:
      - { clause: "grid-code/ECC.6.3.2", pin: "ECC.6.3.2.1–.2.2" }
      - "eirgrid-grid-code/PPM1.6.3"
      - "soni-grid-code/CC.S2.1.3.2"
  - title: "RfG's 0.66 is ±0.33 is 0.95 pf"
    body: >-
      RfG Table 9 limits the PPM inner envelope to a Q/Pmax *range* of 0.66 —
      split evenly, ±0.33, which is 0.95 pf at full output. Synchronous plant
      (Table 8) is allowed a wider range: 0.95 in GB, 1.08 in Ireland & NI.
    refs:
      - { clause: "nc-rfg/Art.21", pin: "21(3)(b), Table 9" }
      - { clause: "nc-rfg/Art.18", pin: "18(2)(b), Table 8" }
  - title: "Slope sets how stiff the plant is"
    body: >-
      GB: setpoint 95–105% in 0.25% steps, slope 2–7% in 0.5% steps. Ireland
      RfG PPMs: 2–7% (non-RfG 1–10%). Irish synchronous condensers: 1–10%,
      settable online by the TSO.
    refs:
      - { clause: "grid-code/ECC.A.7.2", pin: "ECC.A.7.2.2" }
      - "eirgrid-grid-code/PPM1.6.2"
      - "eirgrid-grid-code/SCU1.4.7"
  - title: "Speed: GB 2 s, Ireland 1 s"
    body: >-
      GB PPMs: reactive response starts within 0.2 s and reaches 90% of the
      change within 2 s. Ireland RfG PPMs: 90% within 1 s, settled within 5 s.
    refs:
      - { clause: "grid-code/ECC.A.7.2", pin: "ECC.A.7.2.3" }
      - "eirgrid-grid-code/PPM1.6.2"
  - title: "Synchronous plant: AVR, limiters, PSS"
    body: >-
      Type C/D synchronous modules need a continuously acting AVR; Type D also
      a power system stabiliser to damp electromechanical oscillations. The
      under- and over-excitation limiters set the practical edge of the
      capability curve.
    refs:
      - "grid-code/ECC.A.6.2"
      - "grid-code/ECC.A.6.2.5"
      - { source: "machowski-2020", section: "3.3.4" }
  - title: "NI: switchable modes that fall back to voltage control"
    body: >-
      NI PPMs can run voltage, power-factor or Q control at the connection
      point, but revert to voltage control when voltage leaves the agreed band.
      The same clause limits 0.25–1.75 Hz power oscillations to under 1% of RC.
    refs: ["soni-grid-code/CC.S2.1.7.3"]

