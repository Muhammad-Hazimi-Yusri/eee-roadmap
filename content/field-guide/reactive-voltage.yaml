pitfalls:
  - title: "MEC is not Registered Capacity"
    body: >-
      Irish PPM capability is defined on Registered Capacity at the connection
      point. If a site's export cap (MEC) is below RC, a template built on MEC
      under-sizes the MVAr requirement. Check which base your connection
      agreement uses before signing off a capability study.
    refs: ["eirgrid-grid-code/PPM1.6.3"]
  - title: "Slope definitions differ"
    body: >-
      "4% slope" can mean 4% voltage change for full Q, for Q equal to Pmax, or
      on a different voltage base. Read each code's definition before setting
      the controller or the model parameter — the same number gives different
      stiffness.
    refs: ["grid-code/ECC.A.7.2", "eirgrid-grid-code/PPM1.6.2"]
  - title: "Terminal capability is not connection-point capability"
    body: >-
      Transformer reactance absorbs Q; long cables generate it. Size inverter
      or machine capability for the requirement at the connection point, across
      the whole voltage band.
    refs: [{ clause: "erec-g99/C.7", pin: "C.7.3" }]
  - title: "Reusing legacy GB numbers"
    body: >-
      The old CC asked synchronous units for 0.85 pf lagging to 0.95 leading at
      Rated MW. RfG-era plant follows ECC.6.3.2 instead.
    refs: ["grid-code/CC.6.3.2", "grid-code/ECC.6.3.2"]

inStudies:
  - title: "Reactive capability study"
    body: >-
      P–Q at the connection point at minimum, nominal and maximum voltage,
      with transformers, cables and filters modelled. Then the test confirms
      it on site.
    refs:
      - { clause: "erec-g99/C.7", pin: "C.7.3" }
      - "grid-code/ECP.A.6.4"
  - title: "Voltage control study"
    body: >-
      Setpoint steps and network voltage steps; check start time, rise time,
      settling and overshoot against the code, and how the slope interacts
      with neighbouring controllers.
    refs:
      - "grid-code/ECP.A.3.4"
      - "grid-code/ECP.A.6.5"
      - { clause: "erec-g99/C.7", pin: "C.7.4" }

