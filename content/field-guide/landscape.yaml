      cells:
        GB:  { text: "EON → ION → FON (transmission); embedded plant via G99 and the DNO", refs: ["grid-code/GD.EON-ION-FON", "grid-code/ECP.A.6"] }
        IE:  { text: "EON → ION → FON", ref: "eirgrid-grid-code/CC.15.10" }
        NI:  { text: "EON → ION → FON", ref: "soni-grid-code/CC16.2" }
    - param: "Dynamic model requirements"
      cells:
