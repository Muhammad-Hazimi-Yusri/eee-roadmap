        G99: { text: "Annex C.7.8 — model verification & validation", ref: "erec-g99/C.7" }
        IE:  { text: "PC.A8 — RMS (and EMT where specified)", ref: "eirgrid-grid-code/PC.A8" }
        NI:  { text: "PC Appendix D (PC.D2)", ref: "soni-grid-code/PC.D2" }

pitfalls:
  - title: "Same Type letter, different plant"
    body: >-
      Type letters are only comparable within one synchronous area. A 6 MW
      wind farm is Type C in Ireland (C from 5 MW) but Type B in GB (C from
      10 MW) — it picks up LFSM-U and FSM duties in Ireland that it would not
      have in GB.
    refs: ["ie-rfg-banding/Table", "grid-code/GD.PGM-Types"]
  - title: "Citing GB Grid Code page numbers"
    body: >-
      NESO now publishes changes as update packs; the consolidated text lives
      in the digital code (dcm.neso.energy). Cite clause numbers and the issue
      and revision, not PDF pages. This site's GB clauses were checked against
      Issue 6 Revision 46.
    refs: ["digitalised-grid-code"]
  - title: "Measurement point is part of the requirement"
    body: >-
      Curves and capability envelopes are defined at a named point — GB's Grid
      Entry Point or User System Entry Point, Ireland's connection point (RfG
      plant) or the grid transformer's HV terminals (non-RfG PPMs). Put the
      measurement in your model at that point, not at the inverter terminals.
    refs:
      - { clause: "grid-code/ECC.6.3.15", pin: "ECC.6.3.15.1" }
      - "eirgrid-grid-code/PPM1.4.1"
      - "eirgrid-grid-code/PPM1.6.3"

inStudies:
  - title: "Start with an applicability table"
    body: >-
      Before any study: jurisdiction, transmission or distribution, Type,
      connection voltage, RfG or non-RfG status, technology. Those six facts
      select the clause set. The matrices on each topic page are that table,
      pre-filled.
    refs: []

