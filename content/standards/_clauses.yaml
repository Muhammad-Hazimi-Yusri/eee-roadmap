    projectTypes: [G99-D, BESS, Synch, PPM]
    studyTypes:   [FreqResp]
    forms:        ["Compliance Test Report"]
    summary: "Witness test procedure for demonstrating compliance with ECC.6.3.7 frequency response requirements."

  - ref: grid-code/BC3
    docId: grid-code
    clauseId: BC3
    title: "Frequency Control (commercial delivery)"
    pageStart: 0
    projectTypes: [G99-D, BESS, Synch, PPM]
    studyTypes:   [FreqResp]
    forms:        []
    summary: "Balancing Code 3 — commercial framework for frequency response delivery (Dynamic Containment, Dynamic Moderation, Dynamic Regulation)."

  - ref: grid-code/CC.A.3.2
