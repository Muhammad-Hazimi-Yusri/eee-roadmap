_meta:
  description: |
    High-value clause anchors across the catalogue. Each entry is identified by
    a global `ref` of the form `<docId>/<clauseId>` (e.g. `grid-code/ECC.6.3.15`).
    The clauseId follows the document's own numbering — bare for ENA docs
    (e.g. `13.6`), qualified for Grid Code/CUSC/STC (e.g. `ECC.6.3.15`).

    pageStart is the PDF page index (what `#page=N` opens) of the document's
    catalogue pdfUrl, not the printed page label; 0 means "not pinned".
      - GB Grid Code: NESO no longer publishes a consolidated PDF, so GB clause
        numbers were checked against the digital code (dcm.neso.energy) and
        pages stay 0.
      - NC RfG: articles were checked against the legislation.gov.uk "adopted"
        PDF, whose pagination differs from the EUR-Lex PDF the catalogue links,
        so pages stay 0 and the article number is the anchor.
    Summaries are paraphrases with the key numbers; read the clause itself
    before relying on one in a study.

    Used by:
      - RelatedClausesPanel.tsx (the right-pane peek view)
      - SearchPalette.tsx (Fuse.js index)
      - Permalinks: /tools/grid-code-viewer?doc=...&clause=...&page=...
      - The field guide (/field-guide/), whose references point at these refs

clauses:

  # ─── GB: definitions ────────────────────────────────────────────────────────

  - ref: grid-code/GD.PGM-Types
    docId: grid-code
    clauseId: "GD (Type A–D Power Generating Module)"
    title: "Type A/B/C/D Power Generating Module (definitions)"
    pageStart: 0
    projectTypes: [G99-A, G99-B, G99-C, G99-D, BESS, Synch, PPM]
    studyTypes:   []
    forms:        []
    summary: "GB banding by Maximum Capacity and connection voltage: Type A 0.8 kW to <1 MW, Type B 1 to <10 MW, Type C 10 to <50 MW (all below 110 kV); Type D is 50 MW and above, or any connection at 110 kV or higher."

  - ref: grid-code/GD.Synchronous-Compensation
    docId: grid-code
    clauseId: "GD (Synchronous Compensation Equipment)"
    title: "Synchronous Compensation (definitions)"
    pageStart: 0
    projectTypes: [SynCon]
    studyTypes:   [Reactive]
    forms:        []
    summary: "GB defines Synchronous Compensation as rotating synchronous apparatus run to generate or absorb reactive power, and lists synchronous compensators as dynamic reactive compensation equipment. Unlike EirGrid SCU1 or SONI Schedule 4 there is no dedicated requirements section."

  - ref: grid-code/GD.EON-ION-FON
    docId: grid-code
    clauseId: "GD (EON / ION / FON)"
    title: "Operational Notifications — EON, ION, FON (definitions)"
    pageStart: 0
    projectTypes: [G99-D, BESS, Synch, PPM, HVDC]
    studyTypes:   []
    forms:        ["EON", "ION", "FON"]
    summary: "The staged notifications from NESO: Energisation (EON) for transmission-connected plant, Interim (ION) once the User has shown partial compliance, Final (FON) once compliance is demonstrated. Embedded plant can rely on G99 plus the network operator's final notification."

