_meta:
  description: |
    Hand-curated cross-references between clauses across the catalogue.
    Used by the RelatedClausesPanel to surface "what else should I read?"

    Relation vocabulary:
      defined-in    - source clause defines a term/parameter referenced by target
      defines       - inverse of defined-in (auto-derived; keep manually if useful)
      modified-by   - source clause is modified or amended by target (e.g. GC0155)
      see-also      - peer/companion clause worth reading alongside source
      tested-by     - source clause's compliance is demonstrated via target test procedure
      evidenced-by  - source clause is evidenced by target form/report
      mirrors       - source clause has a direct counterpart in target (often EU NC vs GB,
                      or the same requirement in another jurisdiction's code)
      commercial    - source technical requirement is commercially delivered via target

    `from` and `to` use the global ref format: <docId>/<clauseId>.

