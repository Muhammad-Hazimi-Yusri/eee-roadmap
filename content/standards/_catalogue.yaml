_meta:
  description: |
    Canonical catalogue of UK / EU / international grid codes, network codes, ENA EREC
    documents, planning codes, and connection-process artefacts. Used by the Grid Code
    Viewer tool at /tools/grid-code-viewer/.

    Conventions:
      id            unique slug, lowercase, hyphen-separated
      publisher     NESO | ENA | DCode | EU | UKGov | IEEE | IEC | VDE | AEMC | CIGRE
      license       link-only | hostable-eu | paywalled
                      - link-only  : do not host the PDF, deep-link to publisher URL
                      - hostable-eu: legally hostable under Decision 2011/833/EU or OGL v3
                      - paywalled  : metadata only, user provides their own copy
      projectTypes  subset of: G98, G99-A, G99-B, G99-C, G99-D, BESS, Synch, PPM,
                                HVDC, OFTO, Demand
      studyTypes    subset of: LoadFlow, FaultLevel, Reactive, FRT, FreqResp, AVR,
                                PSS, POD, Harmonics, Flicker, Unbalance, Protection,
                                LoM, EMT, BlackStart, SSO, FFCI
      jurisdiction  GB | EU | Scotland | Offshore | US | DE | AU
      pdfUrl        canonical publisher URL (kept current with publisher updates)
      sizeMb        approx file size — informational only
      pages         approx page count — informational only
      formId        (clauses only) related submission artefact, e.g. "G99 Form A.2-2"

